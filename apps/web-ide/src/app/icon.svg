<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <!-- Deep Glass Squircle Background -->
    <linearGradient id="bf-bg" x1="16" y1="8" x2="112" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>

    <!-- Core Ambient Glow -->
    <radialGradient id="bf-glow" cx="64" cy="54" r="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.35" />
      <stop offset="45%" stop-color="#38BDF8" stop-opacity="0.25" />
      <stop offset="80%" stop-color="#8B5CF6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Specular Rim -->
    <linearGradient id="bf-rim" x1="64" y1="6" x2="64" y2="122" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55" />
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.04" />
    </linearGradient>

    <!-- Multi-stop BEAM & Forge gradient -->
    <linearGradient id="bf-beam-grad" x1="28" y1="28" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="35%" stop-color="#818CF8" />
      <stop offset="68%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
  </defs>

  <!-- 1. Apple Glass Squircle Base -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#bf-bg)" />
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#bf-glow)" />
  <rect x="6.75" y="6.75" width="114.5" height="114.5" rx="27.25" stroke="url(#bf-rim)" stroke-width="1.5" />

  <!-- 2. Translucent OTP Supervisor Hexagon -->
  <polygon points="64,22 100,43 100,85 64,106 28,85 28,43" 
           fill="rgba(255,255,255,0.06)" 
           stroke="url(#bf-beam-grad)" 
           stroke-width="3.5" 
           stroke-linejoin="round" />

  <!-- 3. The Refracting BEAM & Linked Actor Pulse -->
  <path d="M28 64H52L66 40L58 88L74 64H100" 
        stroke="#FFFFFF" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- 4. Forge Ignition Spark (Apex) -->
  <circle cx="66" cy="40" r="3.5" fill="#F59E0B" />

  <!-- 5. Process PID Nodes (Input Cyan, Output Emerald) -->
  <circle cx="28" cy="64" r="5.5" fill="#38BDF8" stroke="#090D16" stroke-width="2" />
  <circle cx="100" cy="64" r="5.5" fill="#10B981" stroke="#090D16" stroke-width="2" />
</svg>
