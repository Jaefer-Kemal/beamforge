version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: beamforge-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: beamforge
      POSTGRES_USER: beamforge
      POSTGRES_PASSWORD: beamforge_dev_secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beamforge -d beamforge"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - beamforge_net

  redis:
    image: redis:7-alpine
    container_name: beamforge-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - beamforge_net

  orchestrator:
    build:
      context: ../services/orchestrator
      dockerfile: Dockerfile
    container_name: beamforge-orchestrator
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      ENV: "development"
      DATABASE_URL: "postgres://beamforge:beamforge_dev_secret@postgres:5432/beamforge?sslmode=disable"
      REDIS_URL: "redis://redis:6379/0"
      SANDBOX_IMAGE: "beamforge-sandbox:latest"
      SANDBOX_POOL_SIZE: "5"
      CURRICULUM_PATH: "/opt/beamforge/curriculum"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../curriculum:/opt/beamforge/curriculum:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - beamforge_net

volumes:
  postgres_data:
  redis_data:

networks:
  beamforge_net:
    driver: bridge
